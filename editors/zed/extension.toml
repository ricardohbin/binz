id = "binz"
name = "binZ"
description = "binZ language support: syntax highlighting, brackets, indentation, outline, completion and diagnostics."
version = "0.1.0"
schema_version = 1
authors = ["Ricardo Bin"]
repository = "https://github.com/ricardohbin/binz"

# The grammar lives in this same repository, under `editors/tree-sitter-binz`.
# Zed clones `repository` at `rev` and builds `path/src/parser.c`, so `rev` has
# to be a commit that already contains the generated parser.
#
# For local development, point `repository` at your checkout instead:
#   repository = "file:///Users/ricardo.bin/dev/binlanguage"
[grammars.binz]
repository = "file:///Users/ricardo.bin/dev/binlanguage"
rev = "caecb4d734f49b975f196b6a1cb9e176bebf0b32"
path = "editors/tree-sitter-binz"

# `binz lsp`, started by `src/lib.rs`: completion, and the compiler's own
# diagnostics as you type.
[language_servers.binz]
name = "binZ"
languages = ["binZ"]
