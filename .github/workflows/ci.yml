name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

      # The end-to-end tests drive the compiler directly, so the examples are
      # the only thing checking that the shipped programs still compile.
      - name: Run the examples
        run: |
          for f in examples/*.binz; do
            echo "--- $f"
            cargo run --quiet --locked -- run "$f"
          done
